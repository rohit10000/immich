name: Build and Deploy to Google Cloud Node

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'web/**'
      - 'packages/**'
      - 'i18n/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - 'mise.lock'
      - '.mise/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Immich Server
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/immich-server
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DEVICE=cpu
            BUILD_ID=${{ github.run_id }}
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}

  deploy:
    name: Deploy to GCP VM
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          port: ${{ secrets.GCP_VM_PORT || 22 }}
          script: |
            set -e
            DEPLOY_DIR="${{ secrets.GCP_DEPLOY_DIR || '~/immich' }}"
            eval DEPLOY_DIR="$DEPLOY_DIR"

            echo "==> Navigating to deployment directory: $DEPLOY_DIR"
            cd "$DEPLOY_DIR"

            echo "==> Pulling latest immich-server image..."
            docker compose pull immich-server

            echo "==> Recreating containers with new image..."
            docker compose up -d

            echo "==> Cleaning up dangling images..."
            docker image prune -f

            echo "==> Deployment successfully finished!"
